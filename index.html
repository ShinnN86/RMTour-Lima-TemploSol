<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Modelo 3D A-Frame</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>

<body>

<a-scene
  webxr="optionalFeatures: hit-test, local-floor"
  renderer="alpha: true"
  vr-mode-ui="enabled: true"
  id="scene">

  <!-- Fondo -->
  <a-sky id="sky" src="image.png"></a-sky>

  <!-- Luces -->
  <a-light type="ambient" intensity="0.5"></a-light>

  <a-light 
    type="directional"
    position="2 5 3"
    intensity="1"
    castShadow="true">
  </a-light>

  <!-- Cámara -->
  <a-camera position="0 1.6 6"></a-camera>

  <!-- Modelo -->
  <a-entity 
    id="modelo"
    gltf-model="Templo del sol.glb"
    position="0 0.8 0"
    scale="1.3 1.3 1.3"
    shadow="cast: true">
  </a-entity>

</a-scene>

<script>
const scene = document.querySelector('#scene');
const sky = document.querySelector('#sky');
const modelo = document.querySelector('#modelo');

// 🔥 Entrar a AR
scene.addEventListener('enter-vr', () => {

  if (scene.is('ar-mode')) {

    console.log("Entrando a AR");

    // ocultar fondo
    sky.setAttribute('visible', 'false');

    // 🔥 reducir tamaño SOLO en AR
    modelo.setAttribute('scale', '0.05 0.05 0.05');

    // mover modelo un poco adelante
    modelo.setAttribute('position', '0 0 -2');
  }
});

// 🔥 Salir de AR
scene.addEventListener('exit-vr', () => {

  console.log("Saliendo de AR");

  // restaurar fondo
  sky.setAttribute('visible', 'true');

  // restaurar tamaño original
  modelo.setAttribute('scale', '0.8 0.8 0.8');

  // restaurar posición
  modelo.setAttribute('position', '0 0.8 0');
});
</script>

</body>
</html>
